<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plans | RevenueFlow</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f5f7fb;
    color: #1f2937;
}

/* ================= SIDEBAR ================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 240px;
    height: 100vh;
    background: #111827;
    color: white;
    padding: 25px 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    padding: 0 15px 30px;
}

.logo span {
    color: #60a5fa;
}

.nav-item {
    display: block;
    padding: 13px 15px;
    margin-bottom: 7px;
    border-radius: 8px;
    color: #cbd5e1;
    text-decoration: none;
    transition: 0.2s;
}

.nav-item:hover {
    background: #1f2937;
    color: white;
}

.nav-item.active {
    background: #2563eb;
    color: white;
}

/* ================= MAIN ================= */

.main {
    margin-left: 240px;
    min-height: 100vh;
}

/* ================= TOPBAR ================= */

.topbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
}

.topbar-title {
    font-size: 18px;
    font-weight: bold;
}

.logout-btn {
    border: none;
    background: #fee2e2;
    color: #dc2626;
    padding: 9px 15px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.logout-btn:hover {
    background: #fecaca;
}

/* ================= CONTENT ================= */

.content {
    padding: 30px;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-title {
    font-size: 28px;
    font-weight: bold;
}

.page-description {
    color: #6b7280;
    margin-top: 6px;
}

.primary-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.primary-btn:hover {
    background: #1d4ed8;
}

/* ================= STATS ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    border-radius: 12px;
    padding: 22px;
    border: 1px solid #e5e7eb;
}

.stat-title {
    color: #6b7280;
    font-size: 14px;
}

.stat-value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

/* ================= FORM ================= */

.form-card {
    display: none;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
}

.form-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group select {
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    outline: none;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #2563eb;
}

.duration-display {
    margin-top: 7px;
    color: #2563eb;
    font-size: 13px;
    font-weight: bold;
}

.form-buttons {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.save-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.save-btn:hover {
    background: #1d4ed8;
}

.cancel-btn {
    background: #e5e7eb;
    color: #374151;
    border: none;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
}

.cancel-btn:hover {
    background: #d1d5db;
}

/* ================= PLAN GRID ================= */

.plan-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.plan-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 25px;
    transition: 0.2s;
}

.plan-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.plan-icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: #dbeafe;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 18px;
}

.plan-name {
    font-size: 20px;
    font-weight: bold;
}

.plan-price {
    font-size: 30px;
    font-weight: bold;
    margin-top: 12px;
}

.plan-period {
    color: #2563eb;
    font-size: 14px;
    font-weight: bold;
    margin-top: 5px;
}

.plan-id {
    color: #9ca3af;
    font-size: 13px;
    margin-top: 12px;
}

.plan-actions {
    margin-top: 22px;
    display: flex;
    gap: 8px;
}

.action-btn {
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.edit-btn {
    background: #dbeafe;
    color: #2563eb;
}

.delete-btn {
    background: #fee2e2;
    color: #dc2626;
}

.action-btn:hover {
    opacity: 0.8;
}

/* ================= EMPTY ================= */

.empty {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    text-align: center;
    padding: 60px;
    color: #6b7280;
}

/* ================= TOAST ================= */

.toast-container {
    position: fixed;
    top: 85px;
    right: 25px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.toast {
    min-width: 300px;
    max-width: 380px;
    background: white;
    border-radius: 10px;
    padding: 15px 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideIn 0.3s ease;
    border-left: 4px solid #2563eb;
}

.toast.success {
    border-left-color: #16a34a;
}

.toast.error {
    border-left-color: #dc2626;
}

.toast.warning {
    border-left-color: #f59e0b;
}

.toast-icon {
    font-size: 20px;
}

.toast-message {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
}

.toast-close {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    color: #6b7280;
}

@keyframes slideIn {

    from {
        opacity: 0;
        transform: translateX(30px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

@keyframes slideOut {

    from {
        opacity: 1;
        transform: translateX(30px);
    }

    to {
        opacity: 0;
        transform: translateX(30px);
    }

}

/* ================= RESPONSIVE ================= */

@media(max-width: 1000px) {

    .plan-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: 1fr;
    }

}

@media(max-width: 700px) {

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
    }

    .content {
        padding: 20px;
    }

    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .plan-grid {
        grid-template-columns: 1fr;
    }

    .toast-container {
        right: 15px;
        left: 15px;
    }

    .toast {
        min-width: auto;
        width: 100%;
    }

}

</style>

</head>

<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">
        Revenue<span>Flow</span>
    </div>

    <a href="index.html" class="nav-item">
        🏠 Dashboard
    </a>

    <a href="customers.html" class="nav-item">
        👥 Customers
    </a>

    <a href="plans.html" class="nav-item active">
        💳 Plans
    </a>

    <a href="subscriptions.html" class="nav-item">
        🔄 Subscriptions
    </a>

</div>


<!-- ================= MAIN ================= -->

<div class="main">

    <div class="topbar">

        <div class="topbar-title">
            Subscription Plans
        </div>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>


    <div class="content">

        <!-- HEADER -->

        <div class="page-header">

            <div>

                <div class="page-title">
                    Plans
                </div>

                <div class="page-description">
                    Create and manage your subscription plans
                </div>

            </div>

            <button
                class="primary-btn"
                onclick="showAddForm()">

                + Create Plan

            </button>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-title">
                    Total Plans
                </div>

                <div
                    class="stat-value"
                    id="totalPlans">
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Lowest Price
                </div>

                <div
                    class="stat-value"
                    id="lowestPrice">
                    ₹0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Highest Price
                </div>

                <div
                    class="stat-value"
                    id="highestPrice">
                    ₹0
                </div>

            </div>

        </div>


        <!-- FORM -->

        <div
            class="form-card"
            id="planForm">

            <div
                class="form-title"
                id="formTitle">
                Create New Plan
            </div>

            <input
                type="hidden"
                id="planId">


            <div class="form-grid">


                <!-- PLAN NAME -->

                <div class="form-group">

                    <label>
                        Plan Name
                    </label>

                    <select
                        id="planName"
                        onchange="updatePlanDetails()">

                        <option value="">
                            Select Plan
                        </option>

                        <option value="Basic">
                            Basic
                        </option>

                        <option value="Pro">
                            Pro
                        </option>

                        <option value="Enterprise">
                            Enterprise
                        </option>

                    </select>

                </div>


                <!-- PRICE -->

                <div class="form-group">

                    <label>
                        Plan Price
                    </label>

                    <input
                        type="number"
                        id="planPrice"
                        placeholder="Enter price"
                        min="0">

                </div>


                <!-- DURATION -->

                <div class="form-group">

                    <label>
                        Subscription Duration
                    </label>

                    <input
                        type="text"
                        id="billingCycle"
                        readonly
                        placeholder="Select a plan">

                    <div
                        class="duration-display"
                        id="durationText">
                    </div>

                </div>

            </div>


            <div class="form-buttons">

                <button
                    class="save-btn"
                    onclick="savePlan()">

                    Save Plan

                </button>

                <button
                    class="cancel-btn"
                    onclick="hideForm()">

                    Cancel

                </button>

            </div>

        </div>


        <!-- PLAN LIST -->

        <div
            id="planContainer"
            class="plan-grid">
        </div>

    </div>

</div>


<!-- ================= TOAST CONTAINER ================= -->

<div
    class="toast-container"
    id="toastContainer">
</div>


<script>

/* ================= LOGIN PROTECTION ================= */

if (
    localStorage.getItem("adminLoggedIn") !== "true"
) {
    window.location.href = "login.html";
}


/* ================= DATA ================= */

let plans = [];


/* ================= PLAN DETAILS ================= */

const planDetails = {

    Basic: {
        duration: "1 Month",
        defaultPrice: 399
    },

    Pro: {
        duration: "6 Months",
        defaultPrice: 799
    },

    Enterprise: {
        duration: "1 Year",
        defaultPrice: 1999
    }

};


/* ================= TOAST ================= */

function showToast(message, type = "success") {

    const container =
        document.getElementById("toastContainer");

    const toast =
        document.createElement("div");

    toast.className =
        `toast ${type}`;

    let icon = "✓";

    if (type === "error") {
        icon = "✕";
    }

    if (type === "warning") {
        icon = "⚠";
    }

    toast.innerHTML = `

        <div class="toast-icon">
            ${icon}
        </div>

        <div class="toast-message">
            ${message}
        </div>

        <button
            class="toast-close"
            onclick="closeToast(this)">
            ×
        </button>

    `;

    container.appendChild(toast);

    setTimeout(() => {

        if (toast.parentElement) {

            toast.style.animation =
                "slideOut 0.3s ease";

            setTimeout(() => {
                toast.remove();
            }, 300);

        }

    }, 3000);

}


/* ================= CLOSE TOAST ================= */

function closeToast(button) {

    const toast =
        button.parentElement;

    toast.style.animation =
        "slideOut 0.3s ease";

    setTimeout(() => {
        toast.remove();
    }, 300);

}


/* ================= GET CORRECT DURATION ================= */

function getBillingCycle(plan) {

    /*
     * IMPORTANT:
     * Plan name has priority.
     *
     * This prevents the old
     * "per month" value in PostgreSQL
     * from being displayed.
     */

    if (plan.name === "Basic") {
        return "1 Month";
    }

    if (plan.name === "Pro") {
        return "6 Months";
    }

    if (plan.name === "Enterprise") {
        return "1 Year";
    }

    /*
     * For any other custom plan,
     * use the value from database.
     */

    if (plan.billingCycle) {
        return plan.billingCycle;
    }

    return "Subscription";

}


/* ================= UPDATE PLAN DETAILS ================= */

function updatePlanDetails() {

    const name =
        document.getElementById("planName").value;

    const priceInput =
        document.getElementById("planPrice");

    const billingCycle =
        document.getElementById("billingCycle");

    const durationText =
        document.getElementById("durationText");


    if (!name || !planDetails[name]) {

        billingCycle.value = "";

        durationText.textContent = "";

        return;

    }


    const details =
        planDetails[name];


    billingCycle.value =
        details.duration;


    durationText.textContent =
        `This plan is valid for ${details.duration}.`;


    /*
     * Automatically fill standard price
     * when creating a new plan.
     */

    if (!document.getElementById("planId").value) {

        priceInput.value =
            details.defaultPrice;

    }

}


/* ================= LOAD PLANS ================= */

function loadPlans() {

    fetch("http://localhost:8080/plans")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load plans"
                );

            }

            return response.json();

        })

        .then(data => {

            plans = data;

            displayPlans();

            updateStats();

        })

        .catch(error => {

            console.error(error);

            document.getElementById(
                "planContainer"
            ).innerHTML = `

                <div class="empty">

                    Unable to load plans.

                </div>

            `;

            showToast(
                "Unable to load plans.",
                "error"
            );

        });

}


/* ================= DISPLAY PLANS ================= */

function displayPlans() {

    const container =
        document.getElementById(
            "planContainer"
        );

    container.innerHTML = "";


    if (plans.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    No Plans Available
                </h3>

                <p>
                    Create your first subscription plan
                    using the button above.
                </p>

            </div>

        `;

        return;

    }


    plans.forEach(plan => {

        const card =
            document.createElement("div");

        card.className =
            "plan-card";


        /*
         * Get correct duration.
         */

        const duration =
            getBillingCycle(plan);


        card.innerHTML = `

            <div class="plan-icon">
                💳
            </div>

            <div class="plan-name">
                ${plan.name}
            </div>

            <div class="plan-price">

                ₹${Number(plan.price)
                    .toLocaleString("en-IN")}

            </div>

            <div class="plan-period">

                ${duration}

            </div>

            <div class="plan-id">

                Plan ID: #${plan.id}

            </div>

            <div class="plan-actions">

                <button
                    class="action-btn edit-btn"
                    onclick="editPlan(${plan.id})">

                    Edit

                </button>

                <button
                    class="action-btn delete-btn"
                    onclick="deletePlan(${plan.id})">

                    Delete

                </button>

            </div>

        `;


        container.appendChild(card);

    });

}


/* ================= STATS ================= */

function updateStats() {

    document.getElementById(
        "totalPlans"
    ).textContent =
        plans.length;


    if (plans.length === 0) {

        document.getElementById(
            "lowestPrice"
        ).textContent =
            "₹0";

        document.getElementById(
            "highestPrice"
        ).textContent =
            "₹0";

        return;

    }


    const prices =
        plans.map(plan =>
            Number(plan.price)
        );


    const lowest =
        Math.min(...prices);

    const highest =
        Math.max(...prices);


    document.getElementById(
        "lowestPrice"
    ).textContent =
        "₹" +
        lowest.toLocaleString("en-IN");


    document.getElementById(
        "highestPrice"
    ).textContent =
        "₹" +
        highest.toLocaleString("en-IN");

}


/* ================= SHOW ADD FORM ================= */

function showAddForm() {

    document.getElementById(
        "planForm"
    ).style.display =
        "block";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Create New Plan";


    document.getElementById(
        "planId"
    ).value = "";


    document.getElementById(
        "planName"
    ).value = "";


    document.getElementById(
        "planPrice"
    ).value = "";


    document.getElementById(
        "billingCycle"
    ).value = "";


    document.getElementById(
        "durationText"
    ).textContent = "";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ================= HIDE FORM ================= */

function hideForm() {

    document.getElementById(
        "planForm"
    ).style.display =
        "none";

}


/* ================= SAVE PLAN ================= */

function savePlan() {

    const id =
        document.getElementById(
            "planId"
        ).value;


    const name =
        document.getElementById(
            "planName"
        ).value;


    const price =
        document.getElementById(
            "planPrice"
        ).value;


    /*
     * Always calculate the duration
     * from the selected plan name.
     */

    let billingCycle = "";


    if (name === "Basic") {

        billingCycle = "1 Month";

    } else if (name === "Pro") {

        billingCycle = "6 Months";

    } else if (name === "Enterprise") {

        billingCycle = "1 Year";

    }


    if (!name) {

        showToast(
            "Please select a plan.",
            "warning"
        );

        return;

    }


    if (price === "") {

        showToast(
            "Please enter plan price.",
            "warning"
        );

        return;

    }


    if (Number(price) < 0) {

        showToast(
            "Price cannot be negative.",
            "warning"
        );

        return;

    }


    const plan = {

        name: name,

        price: Number(price),

        billingCycle: billingCycle

    };


    let url =
        "http://localhost:8080/plans";

    let method =
        "POST";


    if (id) {

        url =
            `http://localhost:8080/plans/${id}`;

        method =
            "PUT";

    }


    fetch(url, {

        method: method,

        headers: {

            "Content-Type":
                "application/json"

        },

        body:
            JSON.stringify(plan)

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Failed to save plan"
            );

        }

        return response.json();

    })

    .then(() => {

        showToast(

            id
                ? "Plan updated successfully!"
                : "Plan created successfully!",

            "success"

        );


        hideForm();

        loadPlans();

    })

    .catch(error => {

        console.error(error);

        showToast(
            "Unable to save plan.",
            "error"
        );

    });

}


/* ================= EDIT PLAN ================= */

function editPlan(id) {

    const plan =
        plans.find(
            p => p.id === id
        );


    if (!plan) {

        showToast(
            "Plan not found.",
            "error"
        );

        return;

    }


    document.getElementById(
        "planForm"
    ).style.display =
        "block";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Plan";


    document.getElementById(
        "planId"
    ).value =
        plan.id;


    document.getElementById(
        "planName"
    ).value =
        plan.name;


    document.getElementById(
        "planPrice"
    ).value =
        plan.price;


    /*
     * Calculate duration from plan name.
     */

    let duration = "";


    if (plan.name === "Basic") {

        duration = "1 Month";

    } else if (plan.name === "Pro") {

        duration = "6 Months";

    } else if (plan.name === "Enterprise") {

        duration = "1 Year";

    } else {

        duration =
            plan.billingCycle || "";

    }


    document.getElementById(
        "billingCycle"
    ).value =
        duration;


    document.getElementById(
        "durationText"
    ).textContent =
        duration
            ? `This plan is valid for ${duration}.`
            : "";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* ================= DELETE PLAN ================= */

function deletePlan(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this plan?"
        );


    if (!confirmed) {
        return;
    }


    fetch(

        `http://localhost:8080/plans/${id}`,

        {
            method: "DELETE"
        }

    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Delete failed"
            );

        }


        showToast(
            "Plan deleted successfully!",
            "success"
        );


        loadPlans();

    })

    .catch(error => {

        console.error(error);

        showToast(
            "Unable to delete plan.",
            "error"
        );

    });

}


/* ================= LOGOUT ================= */

function logout() {

    localStorage.removeItem(
