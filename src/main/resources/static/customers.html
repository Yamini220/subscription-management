<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customers | RevenueFlow</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f5f7fb;
    color: #1f2937;
}

/* ================= SIDEBAR ================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 240px;
    height: 100vh;
    background: #111827;
    color: white;
    padding: 25px 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    padding: 0 15px 30px;
}

.logo span {
    color: #60a5fa;
}

.nav-item {
    display: block;
    padding: 13px 15px;
    margin-bottom: 7px;
    border-radius: 8px;
    color: #cbd5e1;
    text-decoration: none;
    transition: 0.2s;
}

.nav-item:hover {
    background: #1f2937;
    color: white;
}

.nav-item.active {
    background: #2563eb;
    color: white;
}

/* ================= MAIN ================= */

.main {
    margin-left: 240px;
    min-height: 100vh;
}

/* ================= TOPBAR ================= */

.topbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
}

.topbar-title {
    font-size: 18px;
    font-weight: bold;
}

.logout-btn {
    border: none;
    background: #fee2e2;
    color: #dc2626;
    padding: 9px 15px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.logout-btn:hover {
    background: #fecaca;
}

/* ================= CONTENT ================= */

.content {
    padding: 30px;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-title {
    font-size: 28px;
    font-weight: bold;
}

.page-description {
    color: #6b7280;
    margin-top: 6px;
}

.primary-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.primary-btn:hover {
    background: #1d4ed8;
}

/* ================= STAT CARD ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    border-radius: 12px;
    padding: 22px;
    border: 1px solid #e5e7eb;
}

.stat-title {
    color: #6b7280;
    font-size: 14px;
}

.stat-value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

/* ================= FORM ================= */

.form-card {
    display: none;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
}

.form-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input {
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    outline: none;
}

.form-group input:focus {
    border-color: #2563eb;
}

.form-buttons {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.save-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.save-btn:hover {
    background: #1d4ed8;
}

.cancel-btn {
    background: #e5e7eb;
    color: #374151;
    border: none;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
}

.cancel-btn:hover {
    background: #d1d5db;
}

/* ================= TABLE CARD ================= */

.table-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
}

.table-header {
    padding: 20px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.table-title {
    font-size: 18px;
    font-weight: bold;
}

.search-box {
    width: 260px;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    outline: none;
}

.search-box:focus {
    border-color: #2563eb;
}

/* ================= TABLE ================= */

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #f9fafb;
    text-align: left;
    padding: 14px 18px;
    font-size: 13px;
    color: #6b7280;
}

td {
    padding: 16px 18px;
    border-top: 1px solid #f0f0f0;
}

.customer-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #dbeafe;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.customer-name {
    font-weight: bold;
}

.customer-email {
    color: #6b7280;
    font-size: 13px;
    margin-top: 3px;
}

/* ================= ACTIONS ================= */

.action-btn {
    border: none;
    padding: 7px 11px;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 5px;
}

.edit-btn {
    background: #dbeafe;
    color: #2563eb;
}

.delete-btn {
    background: #fee2e2;
    color: #dc2626;
}

.action-btn:hover {
    opacity: 0.8;
}

/* ================= EMPTY ================= */

.empty {
    text-align: center;
    padding: 50px;
    color: #6b7280;
}

/* ================= TOAST ================= */

.toast-container {
    position: fixed;
    top: 85px;
    right: 25px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.toast {
    min-width: 300px;
    max-width: 380px;
    background: white;
    border-radius: 10px;
    padding: 15px 18px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideIn 0.3s ease;
    border-left: 4px solid #2563eb;
}

.toast.success {
    border-left-color: #16a34a;
}

.toast.error {
    border-left-color: #dc2626;
}

.toast.warning {
    border-left-color: #f59e0b;
}

.toast-icon {
    font-size: 20px;
}

.toast-message {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
}

.toast-close {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    color: #6b7280;
}

@keyframes slideIn {

    from {
        opacity: 0;
        transform: translateX(30px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

@keyframes slideOut {

    from {
        opacity: 1;
        transform: translateX(30px);
    }

    to {
        opacity: 0;
        transform: translateX(30px);
    }

}

/* ================= RESPONSIVE ================= */

@media(max-width: 900px) {

    .sidebar {
        width: 200px;
    }

    .main {
        margin-left: 200px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

}

@media(max-width: 700px) {

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
    }

    .content {
        padding: 20px;
    }

    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .table-card {
        overflow-x: auto;
    }

    .search-box {
        width: 180px;
    }

    .toast-container {
        right: 15px;
        left: 15px;
    }

    .toast {
        min-width: auto;
        width: 100%;
    }

}

</style>

</head>

<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">
        Revenue<span>Flow</span>
    </div>

    <a href="index.html" class="nav-item">
        🏠 Dashboard
    </a>

    <a href="customers.html" class="nav-item active">
        👥 Customers
    </a>

    <a href="plans.html" class="nav-item">
        💳 Plans
    </a>

    <a href="subscriptions.html" class="nav-item">
        🔄 Subscriptions
    </a>

</div>


<!-- ================= MAIN ================= -->

<div class="main">

    <!-- TOPBAR -->

    <div class="topbar">

        <div class="topbar-title">
            Customer Management
        </div>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>


    <!-- CONTENT -->

    <div class="content">

        <!-- PAGE HEADER -->

        <div class="page-header">

            <div>

                <div class="page-title">
                    Customers
                </div>

                <div class="page-description">
                    Manage your customers and their information
                </div>

            </div>

            <button
                class="primary-btn"
                onclick="showAddForm()">

                + Add Customer

            </button>

        </div>


        <!-- STAT CARDS -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-title">
                    Total Customers
                </div>

                <div
                    class="stat-value"
                    id="totalCustomers">

                    0

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Customers With Email
                </div>

                <div
                    class="stat-value"
                    id="emailCustomers">

                    0

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Customer Database
                </div>

                <div class="stat-value">
                    Active
                </div>

            </div>

        </div>


        <!-- FORM -->

        <div
            class="form-card"
            id="customerForm">

            <div
                class="form-title"
                id="formTitle">

                Add New Customer

            </div>

            <input
                type="hidden"
                id="customerId">


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Customer Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter customer name">

                </div>


                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="customerEmail"
                        placeholder="Enter email address">

                </div>

            </div>


            <div class="form-buttons">

                <button
                    class="save-btn"
                    onclick="saveCustomer()">

                    Save Customer

                </button>

                <button
                    class="cancel-btn"
                    onclick="hideForm()">

                    Cancel

                </button>

            </div>

        </div>


        <!-- TABLE -->

        <div class="table-card">

            <div class="table-header">

                <div class="table-title">
                    Customer List
                </div>

                <input
                    class="search-box"
                    type="text"
                    id="searchBox"
                    placeholder="Search customers..."
                    oninput="filterCustomers()">

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Customer
                        </th>

                        <th>
                            Customer ID
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>

                <tbody id="customerTable">
                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- ================= TOAST CONTAINER ================= -->

<div
    class="toast-container"
    id="toastContainer">
</div>


<script>

/* ================= LOGIN PROTECTION ================= */

if (
    localStorage.getItem("adminLoggedIn") !== "true"
) {

    window.location.href = "login.html";

}


/* ================= DATA ================= */

let customers = [];


/* ================= TOAST FUNCTION ================= */

function showToast(message, type = "success") {

    const container =
        document.getElementById("toastContainer");


    const toast =
        document.createElement("div");


    toast.className =
        `toast ${type}`;


    let icon = "✓";


    if (type === "error") {
        icon = "✕";
    }


    if (type === "warning") {
        icon = "⚠";
    }


    toast.innerHTML = `

        <div class="toast-icon">
            ${icon}
        </div>

        <div class="toast-message">
            ${message}
        </div>

        <button
            class="toast-close"
            onclick="closeToast(this)">

            ×

        </button>

    `;


    container.appendChild(toast);


    setTimeout(() => {

        if (toast.parentElement) {

            toast.style.animation =
                "slideOut 0.3s ease";

            setTimeout(() => {

                toast.remove();

            }, 300);

        }

    }, 3000);

}


/* ================= CLOSE TOAST ================= */

function closeToast(button) {

    const toast =
        button.parentElement;


    toast.style.animation =
        "slideOut 0.3s ease";


    setTimeout(() => {

        toast.remove();

    }, 300);

}


/* ================= LOAD CUSTOMERS ================= */

function loadCustomers() {

    fetch("http://localhost:8080/customers")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load customers"
                );

            }

            return response.json();

        })

        .then(data => {

            customers = data;

            displayCustomers(customers);

            updateStats();

        })

        .catch(error => {

            console.error(error);

            document.getElementById(
                "customerTable"
            ).innerHTML = `

                <tr>

                    <td
                        colspan="4"
                        class="empty">

                        Unable to load customers.

                    </td>

                </tr>

            `;


            showToast(
                "Unable to load customers.",
                "error"
            );

        });

}


/* ================= DISPLAY ================= */

function displayCustomers(data) {

    const table =
        document.getElementById(
            "customerTable"
        );


    table.innerHTML = "";


    if (data.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty">

                    No customers found.

                </td>

            </tr>

        `;

        return;

    }


    data.forEach(customer => {

        const initials =
            customer.name
                ? customer.name
                    .split(" ")
                    .map(word => word[0])
                    .join("")
                    .substring(0, 2)
                    .toUpperCase()
                : "?";


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>

                <div class="customer-info">

                    <div class="avatar">
                        ${initials}
                    </div>

                    <div>

                        <div class="customer-name">
                            ${customer.name}
                        </div>

                        <div class="customer-email">
                            ${customer.email || "No email"}
                        </div>

                    </div>

                </div>

            </td>


            <td>
                #${customer.id}
            </td>


            <td>
                ${customer.email || "-"}
            </td>


            <td>

                <button
                    class="action-btn edit-btn"
                    onclick="editCustomer(${customer.id})">

                    Edit

                </button>


                <button
                    class="action-btn delete-btn"
                    onclick="deleteCustomer(${customer.id})">

                    Delete

                </button>

            </td>

        `;


        table.appendChild(row);

    });

}


/* ================= SEARCH ================= */

function filterCustomers() {

    const search =
        document
            .getElementById("searchBox")
            .value
            .toLowerCase();


    const filtered =
        customers.filter(customer =>

            (customer.name || "")
                .toLowerCase()
                .includes(search)

            ||

            (customer.email || "")
                .toLowerCase()
                .includes(search)

        );


    displayCustomers(filtered);

}


/* ================= STATS ================= */

function updateStats() {

    document.getElementById(
        "totalCustomers"
    ).textContent =
        customers.length;


    const emailCount =
        customers.filter(customer =>

            customer.email &&
            customer.email.trim() !== ""

        ).length;


    document.getElementById(
        "emailCustomers"
    ).textContent =
        emailCount;

}


/* ================= SHOW ADD FORM ================= */

function showAddForm() {

    document.getElementById(
        "customerForm"
    ).style.display = "block";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add New Customer";


    document.getElementById(
        "customerId"
    ).value = "";


    document.getElementById(
        "customerName"
    ).value = "";


    document.getElementById(
        "customerEmail"
    ).value = "";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* ================= HIDE FORM ================= */

function hideForm() {

    document.getElementById(
        "customerForm"
    ).style.display = "none";

}


/* ================= SAVE CUSTOMER ================= */

function saveCustomer() {

    const id =
        document.getElementById(
            "customerId"
        ).value;


    const name =
        document.getElementById(
            "customerName"
        ).value.trim();


    const email =
        document.getElementById(
            "customerEmail"
        ).value.trim();


    if (!name || !email) {

        showToast(
            "Please enter customer name and email.",
            "warning"
        );

        return;

    }


    const customer = {

        name: name,

        email: email

    };


    let url =
        "http://localhost:8080/customers";


    let method = "POST";


    if (id) {

        url =
            `http://localhost:8080/customers/${id}`;

        method = "PUT";

    }


    fetch(url, {

        method: method,

        headers: {

            "Content-Type":
                "application/json"

        },

        body:
            JSON.stringify(customer)

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Failed to save customer"
            );

        }

        return response.json();

    })

    .then(savedCustomer => {


        /* =====================================================
           NEW CUSTOMER → DASHBOARD NOTIFICATION
           Only runs when a NEW customer is created.
           Editing a customer will NOT create a notification.
        ===================================================== */

        if (!id) {

            const newNotification = {

                type: "success",

                icon: "👤",

                title: "New Customer Added",

                message:
                    name +
                    " has been added to your customers.",

                date:
                    new Date()
                        .toISOString()
                        .split("T")[0],

                timestamp:
                    Date.now()

            };


            let customerNotifications =
                JSON.parse(
                    localStorage.getItem(
                        "createdCustomerNotifications"
                    )
                ) || [];


            customerNotifications.unshift(
                newNotification
            );


            /* Keep the latest 20 notifications */

            customerNotifications =
                customerNotifications.slice(0, 20);


            localStorage.setItem(

                "createdCustomerNotifications",

                JSON.stringify(
                    customerNotifications
                )

            );

        }


        showToast(

            id
                ? "Customer updated successfully!"
                : "Customer added successfully!",

            "success"

        );


        hideForm();

        loadCustomers();

    })

    .catch(error => {

        console.error(error);

        showToast(
            "Unable to save customer.",
            "error"
        );

    });

}


/* ================= EDIT ================= */

function editCustomer(id) {

    const customer =
        customers.find(
            c => c.id === id
        );


    if (!customer) {

        showToast(
            "Customer not found.",
            "error"
        );

        return;

    }


    document.getElementById(
        "customerForm"
    ).style.display = "block";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Customer";


    document.getElementById(
        "customerId"
    ).value =
        customer.id;


    document.getElementById(
        "customerName"
    ).value =
        customer.name;


    document.getElementById(
        "customerEmail"
    ).value =
        customer.email;


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* ================= DELETE ================= */

function deleteCustomer(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this customer?"
        );


    if (!confirmed) {

        return;

    }


    fetch(

        `http://localhost:8080/customers/${id}`,

        {

            method: "DELETE"

        }

    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Delete failed"
            );

        }


        showToast(
            "Customer deleted successfully!",
            "success"
        );


        loadCustomers();

    })

    .catch(error => {

        console.error(error);

        showToast(
            "Unable to delete customer.",
            "error"
        );

    });

}


/* ================= LOGOUT ================= */

function logout() {

    localStorage.removeItem(
        "adminLoggedIn"
    );


    window.location.href =
        "login.html";

}


/* ================= START ================= */

loadCustomers();

</script>

</body>

</html>
